# Security gate for the backend (docs/48 controls 2 and 20).
#
# Every push and pull request: the whole git history is scanned for secrets
# (gitleaks, and the project's own scanner so the same check runs anywhere),
# dependencies are audited with the lockfile, the code must type-check and pass
# its tests, and every migration must apply from empty under strict sql_mode,
# with the permission catalogue, the database identities and the real-MySQL
# spec checked on that schema. A failure here is a red build, never a warning.
name: security
on:
  push:
  pull_request:
  schedule:
    # Dependencies acquire advisories while nobody is pushing.
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: project secret scanner (every blob, every ref)
        run: node scripts/scan-secrets.js
  dependencies:
    name: dependency audit (lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Production dependencies must carry no high or critical advisory. An
      # accepted exception is recorded in docs/48 §7.3 with its expiry, and
      # excluded here by name — never silenced globally.
      - run: npm audit --omit=dev --audit-level=high
      - name: development dependencies (report only)
        run: npm audit --audit-level=high || true
  build-and-test:
    name: type-check, schema, tests
    runs-on: ubuntu-latest
    env:
      # `prisma validate` reads the datasource's variable but never connects: a host-only URL, no credential.
      DATABASE_URL: mysql://ci@127.0.0.1:3306/validate_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx jest --ci
      # A host starts the API with `npm run start:prod`: the file it names must be the one `npm run build` writes
      # (tsconfig includes prisma/, so the entry lands at dist/src/main.js, not dist/main.js).
      - name: the production start command names a file the build writes
        run: |
          npm run build
          entry=$(node -p "require('./package.json').scripts['start:prod'].split(' ').pop()")
          test -f "$entry" || { echo "start:prod runs $entry, which npm run build did not write"; exit 1; }
  database:
    name: migrations, catalogue, identities, real-MySQL spec
    # The runner image's own MySQL 8.0, started for this job and thrown away with it (root's password is the
    # image's documented default). Pinned so the server does not change under the gate.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo systemctl start mysql.service
      - name: database gates (deploy/ci-database-gates.sh)
        env:
          CI_DATABASE_GATES: disposable
          ROOT_PW: root
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
        run: bash deploy/ci-database-gates.sh
  staging-image:
    name: staging image and stack files
    # The Dockerfile and the staging stack (docs/99) as a host would use them: both targets build from the lockfile,
    # the runtime image is non-root and carries no environment file, the compose file resolves, every script parses,
    # and the preflight refuses the committed template (it holds no secret, so it must not pass as a configuration).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the runtime and tools targets
        run: |
          docker build --target runtime --build-arg APP_COMMIT=${{ github.sha }} -t erp-api:ci .
          docker build --target tools -t erp-api-tools:ci .
      - name: runtime image — non-root, stamped, no environment file, Prisma engine loads
        run: |
          test "$(docker inspect -f '{{.Config.User}}' erp-api:ci)" = node
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' erp-api:ci | grep -qx "APP_COMMIT=${{ github.sha }}"
          docker inspect -f '{{.Config.Healthcheck.Test}}' erp-api:ci | grep -q '/api/health/ready'
          if docker run --rm erp-api:ci find /app -maxdepth 2 -name '.env*' | grep .; then echo "an env file is in the image"; exit 1; fi
          docker run --rm erp-api:ci node -e "new (require('@prisma/client').PrismaClient)(); console.log('client ok')"
          docker run --rm erp-api-tools:ci npx prisma --version
      - name: stack files resolve and parse
        run: |
          for f in deploy/staging/*.sh; do bash -n "$f"; done
          for f in deploy/staging/*.mjs; do node --check "$f"; done
          printf 'STAGING_API_HOST=staging-api.example.test\nACME_EMAIL=ops@example.test\nSTAGING_SECRETS_DIR=/tmp/s\nSTAGING_BACKUP_DIR=/tmp/b\nSTAGING_API_ENV_FILE=/tmp/api.env\n' > /tmp/stack.env
          mkdir -p /tmp/s && touch /tmp/s/database.env /tmp/s/migrator.env /tmp/api.env
          docker compose --env-file /tmp/stack.env -f deploy/docker-compose.staging.yml --profile tools config --quiet
          # Only the edge publishes ports; the database never does.
          docker compose --env-file /tmp/stack.env -f deploy/docker-compose.staging.yml --profile tools config --format json \
            | node -e "const c=JSON.parse(require('fs').readFileSync(0,'utf8')); const p=Object.entries(c.services).filter(([,s])=>s.ports?.length).map(([n])=>n); if (p.join()!=='edge') { console.error('ports published by', p); process.exit(1); }"
      - name: the preflight refuses the committed template
        run: |
          if docker run --rm --env-file .env.staging.example erp-api-tools:ci node deploy/staging/preflight.mjs; then
            echo "the preflight passed a template with no secrets"; exit 1
          fi
      - name: the staging edge validates — browser-test site off, and on with a release (docs/99 §14)
        run: |
          image=$(sed -n 's/^    image: \(caddy:.*\)$/\1/p' deploy/docker-compose.staging.yml)
          edge() { docker run --rm -e STAGING_API_HOST=staging-api.example.test -e ACME_EMAIL=ops@example.test "$@" \
            -v "$PWD/deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro" "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; }
          edge -v "$PWD/deploy/staging/web-off:/srv/erp-web:ro"
          web=$(mktemp -d)
          mkdir -p "$web/releases/r1/site" "$web/enabled"
          printf '<!doctype html>' > "$web/releases/r1/site/index.html"
          printf 'route {\n\tfile_server\n}\n' > "$web/releases/r1/routes.caddy"
          ln -s releases/r1 "$web/current"
          cp deploy/staging/web-test.caddy "$web/enabled/"
          hash=$(docker run --rm "$image" caddy hash-password --plaintext ci-only)
          edge -e STAGING_WEB_HOST=erp-test.example.test -e STAGING_WEB_USER=tester -e STAGING_WEB_PASSWORD_HASH="$hash" -v "$web:/srv/erp-web:ro"
  production-stack:
    name: production stack (images, contract, preflight, backups)
    # The production package (docs/100) as the host will use it: both targets build from the lockfile, the compiled API
    # reads its secrets from files and refuses a missing one, the scripts pass shellcheck, the resolved production and
    # rehearsal configurations meet the stack contract, the preflight refuses the committed template, the Caddyfile
    # validates under the pinned Caddy, and an age backup decrypts — and refuses to once a byte is changed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build the runtime and tools targets
        run: |
          docker build --target runtime --build-arg APP_COMMIT=${{ github.sha }} -t erp-api:ci .
          docker build --target tools -t erp-api-tools:ci .
      - name: images — sizes, contents, and the secret files wired into the compiled API
        run: |
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E '^erp-api(-tools)?:ci '
          docker run --rm erp-api:ci test -f dist/src/common/config/load-secret-files.js
          if docker run --rm erp-api:ci sh -c 'ls /app/deploy 2>/dev/null; find /app -maxdepth 2 \( -name "*.age" -o -name "*.pw" -o -name ".env*" \)' | grep .; then
            echo "the runtime image carries deployment files or secrets"; exit 1
          fi
          docker run --rm erp-api-tools:ci sh -c 'ls deploy/production/deploy.sh deploy/production/preflight.mjs scripts/email-prove.ts' > /dev/null
          # A secret file that is missing stops the API before anything is built, with the setting named — never a value.
          set +e
          out=$(docker run --rm -e NODE_ENV=production -e JWT_ACCESS_SECRET_FILE=/run/secrets/missing erp-api:ci 2>&1); code=$?
          set -e
          echo "$out" | tail -n 3
          test "$code" -ne 0
          echo "$out" | grep -q 'JWT_ACCESS_SECRET_FILE names a file that cannot be read'
      - name: scripts — shellcheck, syntax
        run: |
          shellcheck --version | head -n 2
          # Findings become annotations (readable without a sign-in), then fail the step.
          if ! shellcheck -x -S warning -f gcc deploy/production/*.sh > /tmp/shellcheck.txt; then
            sed -E 's/^([^:]+):([0-9]+):([0-9]+): [a-z]+: (.*)$/::error file=\1,line=\2,col=\3::\4/' /tmp/shellcheck.txt
            exit 1
          fi
          for f in deploy/production/*.sh deploy/restore-drill.sh; do bash -n "$f"; done
          for f in deploy/production/*.mjs deploy/staging/smoke.mjs; do node --check "$f"; done
      - name: the resolved configurations meet the stack contract (production and rehearsal)
        run: |
          for profile in production rehearsal; do
            base=/srv/erp-$profile
            if [ $profile = production ]; then host=api.tsxmr.com; http=80; https=443; else host=api.rehearsal.localhost; http=127.0.0.1:8080; https=127.0.0.1:8443; fi
            sudo mkdir -p $base/secrets/api $base/secrets/db $base/backups && sudo chown -R "$USER" $base
            touch $base/api.env $base/secrets/database.env $base/secrets/migrator.env
            printf 'DEPLOY_PROFILE=%s\nAPI_HOST=%s\nACME_EMAIL=developer@tsxmr.com\nEDGE_HTTP_BIND=%s\nEDGE_HTTPS_BIND=%s\nSECRETS_DIR=%s/secrets\nBACKUP_DIR=%s/backups\nAPI_ENV_FILE=%s/api.env\n' \
              $profile $host $http $https $base $base $base > /tmp/stack-$profile.env
            API_IMAGE=erp-api:ci TOOLS_IMAGE=erp-api-tools:ci docker compose -p erp-$profile --env-file /tmp/stack-$profile.env \
              -f deploy/docker-compose.production.yml --profile tools --profile proof config --format json \
              | docker run --rm -i --network none erp-api-tools:ci node deploy/production/check-stack.mjs --profile $profile
          done
      - name: the preflight refuses the committed template
        run: |
          if docker run --rm --env-file .env.production.example -e DEPLOY_PROFILE=production -e EXPECTED_API_HOST=api.tsxmr.com \
               erp-api-tools:ci node deploy/production/preflight.mjs; then
            echo "the preflight passed a template with no secrets"; exit 1
          fi
      - name: the Caddyfile validates under the pinned Caddy — test sites off, and both on with a release (D217)
        run: |
          image=$(sed -n 's/^    image: \(caddy:.*\)$/\1/p' deploy/docker-compose.production.yml)
          edge() { docker run --rm -e ACME_EMAIL=developer@tsxmr.com "$@" \
            -v "$PWD/deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro" "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; }
          for host in api.tsxmr.com api.rehearsal.localhost; do
            edge -e API_HOST=$host -v "$PWD/deploy/production/web-off:/srv/erp-web:ro"
          done
          web=$(mktemp -d)
          for site in app console; do
            mkdir -p "$web/$site/releases/r1/site"
            printf '<!doctype html>' > "$web/$site/releases/r1/site/index.html"
            printf 'route {\n\tfile_server\n}\n' > "$web/$site/releases/r1/routes.caddy"
            ln -s releases/r1 "$web/$site/current"
          done
          mkdir -p "$web/enabled"
          cp deploy/production/test-app.caddy deploy/production/test-console.caddy "$web/enabled/"
          hash=$(docker run --rm "$image" caddy hash-password --plaintext ci-only)
          edge -e API_HOST=api.tsxmr.com -e TEST_APP_HOST=erp-test.example.test -e TEST_CONSOLE_HOST=dukan-test.example.test \
            -e TEST_WEB_USER=tester -e TEST_WEB_PASSWORD_HASH="$hash" -v "$web:/srv/erp-web:ro"
      - name: age backups — round trip, wrong key and a changed byte refused
        run: |
          sudo apt-get install -y --no-install-recommends age > /dev/null
          age --version
          d=$(mktemp -d); cd "$d"
          age-keygen -o id.txt 2> /dev/null; age-keygen -y id.txt > recipients
          age-keygen -o other.txt 2> /dev/null
          printf -- '-- MySQL dump\nINSERT INTO t VALUES (1);\n-- Dump completed on 2026-10-18\n' | gzip -9 | age --encrypt -R recipients -o b.sql.gz.age
          age --decrypt -i id.txt b.sql.gz.age | gunzip | grep -q 'Dump completed on'
          if age --decrypt -i other.txt b.sql.gz.age > /dev/null 2>&1; then echo "decrypted with the wrong key"; exit 1; fi
          # Change one byte near the end, to a value it did not have: authenticated encryption must notice.
          pos=$(( $(stat -c %s b.sql.gz.age) - 20 ))
          old=$(dd if=b.sql.gz.age bs=1 skip=$pos count=1 2> /dev/null | od -An -tu1 | tr -d ' ')
          printf "\\$(printf %03o $(( (old + 1) % 256 )))" | dd of=b.sql.gz.age bs=1 seek=$pos conv=notrunc 2> /dev/null
          test "$(dd if=b.sql.gz.age bs=1 skip=$pos count=1 2> /dev/null | od -An -tu1 | tr -d ' ')" != "$old"
          if age --decrypt -i id.txt b.sql.gz.age > /dev/null 2>&1; then echo "a changed byte was not detected"; exit 1; fi
          echo "age: round trip ok; wrong key refused; changed byte refused"
