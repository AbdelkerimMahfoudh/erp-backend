# Security gate for the backend (docs/48 controls 2 and 20).
#
# Every push and pull request: the whole git history is scanned for secrets
# (gitleaks, and the project's own scanner so the same check runs anywhere),
# dependencies are audited with the lockfile, the code must type-check and pass
# its tests, and every migration must apply from empty under strict sql_mode,
# with the permission catalogue, the database identities and the real-MySQL
# spec checked on that schema. A failure here is a red build, never a warning.
name: security
on:
  push:
  pull_request:
  schedule:
    # Dependencies acquire advisories while nobody is pushing.
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: project secret scanner (every blob, every ref)
        run: node scripts/scan-secrets.js
  dependencies:
    name: dependency audit (lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Production dependencies must carry no high or critical advisory. An
      # accepted exception is recorded in docs/48 §7.3 with its expiry, and
      # excluded here by name — never silenced globally.
      - run: npm audit --omit=dev --audit-level=high
      - name: development dependencies (report only)
        run: npm audit --audit-level=high || true
  build-and-test:
    name: type-check, schema, tests
    runs-on: ubuntu-latest
    env:
      # `prisma validate` reads the datasource's variable but never connects: a host-only URL, no credential.
      DATABASE_URL: mysql://ci@127.0.0.1:3306/validate_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx jest --ci
      # A host starts the API with `npm run start:prod`: the file it names must be the one `npm run build` writes
      # (tsconfig includes prisma/, so the entry lands at dist/src/main.js, not dist/main.js).
      - name: the production start command names a file the build writes
        run: |
          npm run build
          entry=$(node -p "require('./package.json').scripts['start:prod'].split(' ').pop()")
          test -f "$entry" || { echo "start:prod runs $entry, which npm run build did not write"; exit 1; }
  database:
    name: migrations, catalogue, identities, real-MySQL spec
    # The runner image's own MySQL 8.0, started for this job and thrown away with it (root's password is the
    # image's documented default). Pinned so the server does not change under the gate.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo systemctl start mysql.service
      - name: database gates (deploy/ci-database-gates.sh)
        env:
          CI_DATABASE_GATES: disposable
          ROOT_PW: root
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
        run: bash deploy/ci-database-gates.sh
  staging-image:
    name: staging image and stack files
    # The Dockerfile and the staging stack (docs/99) as a host would use them: both targets build from the lockfile,
    # the runtime image is non-root and carries no environment file, the compose file resolves, every script parses,
    # and the preflight refuses the committed template (it holds no secret, so it must not pass as a configuration).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the runtime and tools targets
        run: |
          docker build --target runtime --build-arg APP_COMMIT=${{ github.sha }} -t erp-api:ci .
          docker build --target tools -t erp-api-tools:ci .
      - name: runtime image — non-root, stamped, no environment file, Prisma engine loads
        run: |
          test "$(docker inspect -f '{{.Config.User}}' erp-api:ci)" = node
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' erp-api:ci | grep -qx "APP_COMMIT=${{ github.sha }}"
          docker inspect -f '{{.Config.Healthcheck.Test}}' erp-api:ci | grep -q '/api/health/ready'
          if docker run --rm erp-api:ci find /app -maxdepth 2 -name '.env*' | grep .; then echo "an env file is in the image"; exit 1; fi
          docker run --rm erp-api:ci node -e "new (require('@prisma/client').PrismaClient)(); console.log('client ok')"
          docker run --rm erp-api-tools:ci npx prisma --version
      - name: stack files resolve and parse
        run: |
          for f in deploy/staging/*.sh; do bash -n "$f"; done
          for f in deploy/staging/*.mjs; do node --check "$f"; done
          printf 'STAGING_API_HOST=staging-api.example.test\nACME_EMAIL=ops@example.test\nSTAGING_SECRETS_DIR=/tmp/s\nSTAGING_BACKUP_DIR=/tmp/b\nSTAGING_API_ENV_FILE=/tmp/api.env\n' > /tmp/stack.env
          mkdir -p /tmp/s && touch /tmp/s/database.env /tmp/s/migrator.env /tmp/api.env
          docker compose --env-file /tmp/stack.env -f deploy/docker-compose.staging.yml --profile tools config --quiet
          # Only the edge publishes ports; the database never does.
          docker compose --env-file /tmp/stack.env -f deploy/docker-compose.staging.yml --profile tools config --format json \
            | node -e "const c=JSON.parse(require('fs').readFileSync(0,'utf8')); const p=Object.entries(c.services).filter(([,s])=>s.ports?.length).map(([n])=>n); if (p.join()!=='edge') { console.error('ports published by', p); process.exit(1); }"
      - name: the preflight refuses the committed template
        run: |
          if docker run --rm --env-file .env.staging.example erp-api-tools:ci node deploy/staging/preflight.mjs; then
            echo "the preflight passed a template with no secrets"; exit 1
          fi
